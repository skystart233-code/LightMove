name: 功能建议
description: 为轻移 LightMove 提出可验证的改进建议
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: |
        感谢建议。请说明要解决的问题和使用场景，而不只描述实现方式。
        轻移基于 Raw Accel v1.7.1 的驱动与算法；涉及底层驱动的改动需要单独评估。
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 当前体验哪里不方便？在什么场景下发生？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 你希望软件如何改变？可以是交互、文案、预设或验证方式。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案
    validations:
      required: false
  - type: textarea
    id: scope
    attributes:
      label: 影响范围
      description: 是否涉及驱动、曲线算法、配置格式、托盘、开机自启或指针功能？
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 issue，确认不是重复建议
          required: true
        - label: 我理解界面建议与底层驱动改动需要分别验证
          required: true
