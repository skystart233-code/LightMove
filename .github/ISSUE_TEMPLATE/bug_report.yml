name: 问题反馈
description: 报告轻移 LightMove 的使用问题
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。提交前请先查阅 [使用指南](https://github.com/skystart233-code/LightMove/blob/main/README.zh-CN.md)，并确认问题可以在最新预览版复现。
        请勿上传个人配置、账户令牌、密钥、完整鼠标输入记录或其他敏感信息。
  - type: input
    id: version
    attributes:
      label: 轻移版本
      description: 可在关于窗口或下载文件名中查看。
      placeholder: 0.5.0-preview
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows 版本与架构
      placeholder: Windows 11 23H2 x64
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请写出从启动到问题出现的最短步骤。
      placeholder: |
        1. 打开轻移
        2. 选择...
        3. 出现...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 补充环境
      description: 显示缩放、多显示器、驱动安装状态、是否使用托盘或开机自启等；不要粘贴个人配置或输入记录。
      render: text
    validations:
      required: false
  - type: textarea
    id: attachments
    attributes:
      label: 截图或日志
      description: 可拖入截图或脱敏后的错误文本。请先移除用户名、路径、令牌和个人设置。
      render: text
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 issue，确认不是重复问题
          required: true
        - label: 我已移除个人配置、密钥、令牌和鼠标输入记录
          required: true
        - label: 我使用的是本仓库发布的最新预览版，或已说明不同版本
          required: true
